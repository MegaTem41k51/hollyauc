<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HollyAuc — поинтовые аукционы для стримеров</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--bg2:#14101f;--card:#1a1528;--card2:#221b36;--border:#2d2444;--text:#efeafb;--muted:#9a8fc0;--violet:#8b5cf6;--pink:#ec4899;--cyan:#22d3ee;--gold:#fbbf24;--grad:linear-gradient(135deg,#8b5cf6,#ec4899)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
h1,h2,h3{line-height:1.15}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:12px 24px;transition:.2s;text-decoration:none;color:#fff}
.btn-primary{background:var(--grad);box-shadow:0 4px 24px rgba(139,92,246,.4)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-sm{padding:9px 18px;font-size:14px;border-radius:10px}
.btn-twitch{background:#9146ff;box-shadow:0 4px 20px rgba(145,70,255,.4)}
.btn-da{background:#19c37d;box-shadow:0 4px 20px rgba(25,195,125,.35);color:#04220f}
input,textarea{background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:11px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--violet)}
label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin:14px 0 6px}

header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(12,10,20,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:13px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;text-decoration:none;color:var(--text)}
.logo-badge{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:17px}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ava{width:34px;height:34px;border-radius:50%;border:2px solid var(--violet)}

main{max-width:1100px;margin:0 auto;padding:110px 24px 60px}
.hero{text-align:center;padding:40px 0 20px}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:-2px;margin-bottom:16px}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 30px;line-height:1.6}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.h2{font-size:22px;font-weight:900;margin-bottom:16px}
.muted{color:var(--muted)}
.mt{margin-top:20px}

.lot-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.lot-row input:first-child{max-width:60px}
.auction-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--border)}
.auction-item:last-child{border-bottom:none}
.auction-item a{color:var(--cyan);font-weight:700;text-decoration:none}
.code-chip{font-family:'JetBrains Mono',monospace;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:13px}

/* auction room */
.room-top{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;border-radius:20px 20px 0 0}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(236,72,153,.15);color:var(--pink);border:1px solid rgba(236,72,153,.4);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
.room{background:var(--bg2);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-top:24px}
.room-grid{display:grid;grid-template-columns:1.5fr 1fr}
@media(max-width:860px){.room-grid{grid-template-columns:1fr}}
.lots{padding:22px;border-right:1px solid var(--border)}
@media(max-width:860px){.lots{border-right:none;border-bottom:1px solid var(--border)}}
.side{padding:22px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.panel h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.lot{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.2s}
.lot.leader{border-color:var(--gold);box-shadow:0 0 24px rgba(251,191,36,.12)}
.lot-ava{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card2);flex-shrink:0}
.lot-info{flex:1;min-width:0}
.lot-name{font-weight:700;font-size:15px}
.lot-sub{font-size:12px;color:var(--muted);margin-top:2px}
.lot-price{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px;color:var(--gold)}
.btn-bid{background:var(--grad);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:800;font-family:inherit;font-size:13px;cursor:pointer}
.bid-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;animation:slideIn .3s ease}
.bid-row:last-child{border-bottom:none}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.bid-name{font-weight:700}
.bid-lot{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bid-pts{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--cyan)}
.bid-pts.donate{color:#19c37d}
.total-sum{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.winner-banner{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(236,72,153,.15));border:1px solid var(--gold);border-radius:16px;padding:22px;text-align:center;font-size:18px;font-weight:800;margin-bottom:16px}
.nick-row{display:flex;gap:10px;margin-bottom:16px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:13px 22px;font-weight:700;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px;border-top:1px solid var(--border)}
.err{color:var(--pink);font-size:13px;margin-top:10px}
</style>
<base target="_blank">
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/"><span class="logo-badge">🎄</span>Holly<span>Auc</span></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</header>

<main id="app"></main>
<footer>© 2026 <b>HollyAuc</b> · поинтовые аукционы для стримеров</footer>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let me = null, auction = null, es = null;
let nick = localStorage.getItem('ha_nick') || '';
const path = location.pathname;

async function api(url, opts) {
  const r = await fetch(url, opts ? { headers: {'Content-Type':'application/json'}, ...opts } : {});
  if (r.status === 401) return null;
  return r.json();
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadMe() {
  me = await api('/api/me');
  renderNav();
}
function renderNav() {
  $('#navRight').innerHTML = me
    ? `<a class="btn btn-da btn-sm" href="/auth/da">${me.da ? '✅ DonationAlerts' : '🔔 Подключить DonationAlerts'}</a>
       <img class="ava" src="${me.avatar}" title="${esc(me.name)}">
       <a class="btn btn-ghost btn-sm" href="/auth/logout">Выход</a>`
    : `<a class="btn btn-twitch btn-sm" href="/auth/twitch">🔑 Войти через Twitch</a>`;
}

/* ============ главная / дашборд ============ */
function renderHome() {
  if (!me) {
    app.innerHTML = `
      <div class="hero">
        <h1>Поинтовые аукционы, <span class="grad">которые вовлекают</span> чат</h1>
        <p>Зрители ставят баллы и донатят — донаты DonationAlerts зачисляются автоматически. Крути колесо и выбирай победителя справедливо.</p>
        <a class="btn btn-twitch" href="/auth/twitch">🔑 Войти через Twitch</a>
      </div>`;
    return;
  }
  app.innerHTML = `
    <div class="grid2">
      <div class="card">
        <div class="h2">🆕 Новый аукцион</div>
        <label>Название</label><input id="fTitle" placeholder="Новогодний марафон 🎄" maxlength="60">
        <label>Шаг ставки (баллов)</label><input id="fStep" type="number" value="100" min="10">
        <label>Лоты</label>
        <div id="lotRows"></div>
        <button class="btn btn-ghost btn-sm mt" onclick="addLotRow()">+ Добавить лот</button>
        <div class="err" id="createErr"></div>
        <button class="btn btn-primary mt" style="width:100%;justify-content:center" onclick="createAuction()">Создать аукцион 🚀</button>
        ${me.da ? '' : '<div class="err">⚠️ DonationAlerts не подключен — донаты не будут засчитываться. Подключи кнопкой сверху.</div>'}
      </div>
      <div class="card">
        <div class="h2">📋 Мои аукционы</div>
        <div id="myList" class="muted">Загрузка…</div>
      </div>
    </div>`;
  addLotRow(); addLotRow(); addLotRow();
  loadMy();
}
function addLotRow(name) {
  const d = document.createElement('div'); d.className = 'lot-row';
  d.innerHTML = `<input placeholder="🎁" maxlength="4" style="max-width:60px" class="e"><input placeholder="Название лота" maxlength="60" class="n">`;
  if (name) d.querySelector('.n').value = name;
  $('#lotRows').appendChild(d);
}
async function loadMy() {
  const list = await api('/api/my');
  $('#myList').innerHTML = (list && list.length) ? list.map(a => `
    <div class="auction-item">
      <span class="code-chip">${a.code}</span>
      <div style="flex:1"><b>${esc(a.title)}</b><br><span class="muted" style="font-size:12px">${a.total.toLocaleString('ru-RU')} баллов · ${a.active?'<span style="color:#4ade80">активен</span>':'завершён'}</span></div>
      <a href="/a/${a.code}">Открыть →</a>
    </div>`).join('') : 'Пока пусто. Создай первый аукцион!';
}
async function createAuction() {
  const lots = [...document.querySelectorAll('#lotRows .lot-row')].map(r => ({
    emoji: r.querySelector('.e').value || '🎁', name: r.querySelector('.n').value.trim()
  })).filter(l => l.name);
  const r = await fetch('/api/auctions', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title: $('#fTitle').value, step: $('#fStep').value, lots }) });
  const d = await r.json();
  if (!r.ok) return $('#createErr').textContent = d.error || 'Ошибка';
  location.href = d.url;
}

/* ============ страница аукциона ============ */
async function renderAuction(code) {
  auction = await api('/api/auction/' + code);
  if (!auction || auction.error) { app.innerHTML = '<div class="hero"><h1>Аукцион не найден 😢</h1></div>'; return; }
  app.innerHTML = `
    <div class="room">
      <div class="room-top">
        <span class="live">● LIVE</span>
        <b style="font-size:16px">${esc(auction.title)}</b>
        <span class="code-chip" style="margin-left:auto">${auction.code}</span>
        <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(location.href).then(()=>toast('Ссылка скопирована!'))">🔗 Поделиться</button>
      </div>
      <div id="winnerSlot"></div>
      <div class="room-grid">
        <div class="lots"><div id="lotList"></div></div>
        <div class="side">
          <div class="nick-row">
            <input id="nick" placeholder="Твой ник для ставок" value="${esc(nick)}" maxlength="24">
          </div>
          <div class="panel"><h4>Сумма аукциона</h4><div class="total-sum" id="totalSum">0</div></div>
          <div class="panel"><h4>Последние ставки</h4><div id="bidFeed"></div></div>
          <button class="btn btn-primary" id="spinBtn" style="justify-content:center" onclick="spin()">🎡 Крутить колесо</button>
          <div class="muted" style="font-size:12px">💰 Донат с текстом <span class="code-chip">#номерлота</span> засчитается в этот лот автоматически в баллы (курс задаётся в .env). Без # — в текущий лидер.</div>
        </div>
      </div>
    </div>`;
  drawAuction();
  es = new EventSource('/api/events/' + code);
  es.onmessage = e => { auction = JSON.parse(e.data); drawAuction(); };
}
function drawAuction() {
  const leader = auction.lots.filter(l => l.pts > 0).sort((a,b) => b.pts - a.pts)[0];
  $('#lotList').innerHTML = auction.lots.map(l => `
    <div class="lot ${leader && l.id === leader.id && l.pts > 0 ? 'leader' : ''}">
      <div class="lot-ava">${esc(l.emoji)}</div>
      <div class="lot-info">
        <div class="lot-name">${esc(l.name)}</div>
        <div class="lot-sub">${l.leader ? '👑 ' + esc(l.leader) : 'ставок нет'}</div>
      </div>
      <div class="lot-price">${l.pts > 0 ? l.pts.toLocaleString('ru-RU') + ' ⚡' : '—'}</div>
      ${auction.active ? `<button class="btn-bid" onclick="placeBid(${l.id})">+${auction.step}</button>` : ''}
    </div>`).join('');
  $('#totalSum').textContent = auction.total.toLocaleString('ru-RU');
  $('#bidFeed').innerHTML = auction.feed.slice(0, 12).map(b => `
    <div class="bid-row">
      <span class="bid-name">${esc(b.name)}</span>
      <span class="bid-lot">${esc(b.lot)}</span>
      <span class="bid-pts ${b.type === 'donate' ? 'donate' : ''}">${b.type === 'donate' ? '💰+' + b.pts : '+' + b.pts}</span>
    </div>`).join('') || '<span class="muted" style="font-size:13px">Пока тихо…</span>';
  $('#winnerSlot').innerHTML = auction.winner
    ? `<div style="padding:20px 22px 0"><div class="winner-banner">🏆 Победил лот «${esc(auction.winner.lot)}» — лидер: ${esc(auction.winner.leader)} (${auction.winner.pts.toLocaleString('ru-RU')} ⚡)</div></div>` : '';
  const canSpin = me && auction.active && auction.total > 0;
  $('#spinBtn').style.display = canSpin ? '' : 'none';
  if (!auction.active && !auction.winner) $('#spinBtn').style.display = 'none';
}
async function placeBid(lotId) {
  nick = $('#nick').value.trim() || 'Аноним';
  localStorage.setItem('ha_nick', nick);
  const r = await fetch(`/api/auction/${auction.code}/bid`, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ lotId, name: nick }) });
  const d = await r.json();
  if (!r.ok) return toast(d.error || 'Ошибка ставки');
  auction = d; drawAuction();
}
async function spin() {
  const r = await fetch(`/api/auction/${auction.code}/spin`, { method:'POST' });
  const d = await r.json();
  if (!r.ok) return toast(d.error || 'Ошибка');
  auction = d; drawAuction();
  toast('🏆 ' + auction.winner.lot);
}

/* ============ роутинг ============ */
(async () => {
  await loadMe();
  const m = path.match(/^\/a\/([a-z0-9]{6})$/);
  if (m) renderAuction(m[1]); else renderHome();
  const q = new URLSearchParams(location.search);
  if (q.get('error') === 'twitch') toast('❌ Ошибка входа в Twitch (проверь .env)');
  if (q.get('error') === 'da') toast('❌ Ошибка подключения DonationAlerts');
  if (q.get('da') === 'ok') toast('✅ DonationAlerts подключён! Донаты будут засчитываться.');
})();
</script>
</body>
</html>
